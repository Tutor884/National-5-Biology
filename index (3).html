d 0.5 M** (accept ~0.4 M) (1), because this is where the change in mass crosses **zero** — the water concentration of the solution **equals** that inside the potato cells, so there is **no net movement of water** (1). **(2)**\n    b) The water concentration **outside** the cells is **lower** than inside (1), so water moves **out of the cells by osmosis** and the discs lose mass (1). **(2)**"}, {"q": "An enzyme's activity was measured at pH 2, 4, 6, 8 and 10. Activity peaked at pH 4.\n\na) Explain the low activity at pH 10. (2)\n\nb) Describe how the pupil could find the optimum pH more accurately. (1)\n\nc) The experiment was carried out once at each pH. State how reliability could be improved. (1)", "marks": 4, "a": "a) The enzyme is **denatured** at pH 10 (1); the **shape of its active site changes** so it is **no longer complementary to the substrate** (1). **(2)**\n    b) Test **more pH values at smaller intervals between pH 2 and pH 6**. **(1)**\n    c) **Repeat each pH and calculate an average.** **(1)**"}]}, "special": null}, {"n": 15, "date": "Tue 6 Oct", "title": "Final consolidation", "area": "All", "warmup": [], "drill": "", "reps": [], "boss": null, "paper": null, "special": "final", "sequences": [{"t": "Photosynthesis — the two stages", "a": "**Light reactions:** light energy trapped by **chlorophyll** in the **chloroplasts** → converted to chemical energy → used to **generate ATP**; **water is split** into **hydrogen** and **oxygen**; oxygen diffuses out of the cell.\n\n**Passes on: hydrogen and ATP.**\n\n**Carbon fixation:** a series of **enzyme-controlled** reactions using **hydrogen + ATP + carbon dioxide** to produce **sugar**."}, {"t": "The algal bloom chain", "a": "1. Fertiliser **leaches** into fresh water — extra unwanted **nitrates**\n2. **Algal populations increase** → algal bloom\n3. The bloom **reduces light levels**\n4. **Aquatic plants die**\n5. **Bacteria feed** on the dead plants and algae\n6. **Bacteria increase greatly in number**\n7. Bacteria **use up large quantities of oxygen** → too little oxygen for other organisms"}, {"t": "Natural selection — four steps", "a": "1. Species produce **more offspring than the environment can sustain**\n2. There is **variation** in the population, and a **selection pressure**\n3. The **best adapted survive to reproduce**, passing on the **favourable alleles** that give the selective advantage\n4. Those **alleles increase in frequency** in the population"}, {"t": "Speciation", "a": "1. Part of a population is **isolated by an isolation barrier** — **geographical**, **ecological** or **behavioural**\n2. **Different mutations** occur in each sub-population\n3. **Natural selection selects for different mutations**, because the **selection pressures differ**\n4. Each sub-population evolves until they are so **genetically different** they are **two different species**"}, {"t": "Enzyme denaturation", "a": "The enzyme is **denatured** → the **shape of the active site changes** → it is **no longer complementary to the substrate** → the substrate cannot bind → the **rate of reaction falls**.\n\nNever write that the enzyme *dies* or is *killed*. It is a molecule."}], "checklist": ["Finished by 21:00 — cramming past that costs more in recall than it gains", "Ruler, calculator and spare pen packed tonight", "Read the quick-reference once — the ten answers that score zero", "Sleep. Highest-return revision available at this point."], "examRules": ["Underline the command word before answering: state, describe, explain, calculate, suggest", "Marks = points. A 3-mark question wants three separate points", "Every calculation gets a unit", "Nothing blank — a sensible guess costs nothing", "An 'explain' answer should contain a because or a so that"]}]}</script>
<script>
(function(){
"use strict";
const COURSE = JSON.parse(document.getElementById('course-data').textContent);
const DAYS = COURSE.days;

/* ---------------- state ---------------- */
let S = { days:{}, offenders:[], drafts:{} };
let saveTimer=null;
const LS='apass.v1';

function loadLocal(){ try{ const r=localStorage.getItem(LS); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function note(t){ const n=document.getElementById('saveNote'); n.textContent=t||' '; }

function save(){
  saveLocal();
  note('Progress saved on this device');
}

/* ---------------- helpers ---------------- */
function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  return s;
}

/* compact markdown renderer for the drill notes */
function md(src){
  if(!src) return '';
  const lines = src.replace(/\r/g,'').split('\n');
  let out='', i=0;
  function flushTable(){
    let rows=[];
    while(i<lines.length && /^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }
    if(rows.length<2) return;
    const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    const head = cells(rows[0]);
    const body = rows.slice(2).map(cells);
    out += '<div class="tablewrap"><table><thead><tr>' +
      head.map(h=>'<th>'+inline(h)+'</th>').join('') + '</tr></thead><tbody>' +
      body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('') +
      '</tbody></table></div>';
  }
  while(i<lines.length){
    const l = lines[i];
    if(/^\s*$/.test(l)){ i++; continue; }
    if(/^\s*\|/.test(l)){ flushTable(); continue; }
    let m;
    if((m=l.match(/^(#{3,4})\s+(.*)$/))){ out+='<h3>'+inline(m[2])+'</h3>'; i++; continue; }
    if(/^>\s?/.test(l)){
      let buf=[];
      while(i<lines.length && /^>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^>\s?/,'')); i++; }
      const txt=buf.join(' ');
      const cls = /⚠️/.test(txt) ? ' class="warnquote"' : '';
      out+='<blockquote'+cls+'><p>'+inline(txt)+'</p></blockquote>'; continue;
    }
    if(/^\s*[-*]\s+/.test(l)){
      out+='<ul>';
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ out+='<li>'+inline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>'; i++; }
      out+='</ul>'; continue;
    }
    if(/^\s*\d+\.\s+/.test(l)){
      out+='<ol>';
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ out+='<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>'; i++; }
      out+='</ol>'; continue;
    }
    if(/^---+$/.test(l.trim())){ i++; continue; }
    let buf=[];
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^\s*[|>#-]/.test(lines[i]) && !/^\s*\d+\.\s/.test(lines[i]) && !(buf.length && /^\s*[a-e]\)\s/.test(lines[i]))){ buf.push(lines[i]); i++; }
    if(buf.length) out+='<p>'+inline(buf.join(' '))+'</p>';
  }
  return out;
}

function dayState(n){
  if(!S.days[n]) S.days[n]={stage:0, marks:{}, picks:{}, warm:{}, xp:0, done:false};
  if(!S.days[n].picks) S.days[n].picks={};
  return S.days[n];
}
function totalXP(){ let t=0; for(const k in S.days) t+=(S.days[k].xp||0); return t; }
function streak(){
  let run=0;
  for(let n=1;n<=DAYS.length;n++){ if(S.days[n] && S.days[n].done) run++; else if(n<=todayIndex()) run=0; }
  return run;
}
function todayIndex(){
  const start = new Date(2026,8,22);
  const now = new Date();
  const diff = Math.floor((now - start)/86400000);
  return Math.min(Math.max(diff+1,1),DAYS.length);
}
function daysToTest(){
  const t = new Date(2026,9,7);
  return Math.max(0, Math.ceil((t - new Date())/86400000));
}

/* ---------------- offenders ---------------- */
function addOffender(day,q,a,got,max){
  S.offenders = S.offenders.filter(function(o){ return !(o.day===day && o.q===q); });
  S.offenders.push({day:day,q:q,a:a,got:got,max:max,ts:Date.now()});
}
function dropOffender(day,q){
  S.offenders = S.offenders.filter(function(o){ return !(o.day===day && o.q===q); });
}

/* ---------------- render ---------------- */
let tab='mission', cur=todayIndex();
const view=document.getElementById('view');

function paintStats(){
  document.getElementById('xpStat').textContent = totalXP();
  document.getElementById('streakStat').textContent = streak();
  const d=daysToTest();
  document.getElementById('countdown').textContent = d===0 ? 'test today' : (d+(d===1?' day to go':' days to go'));
}

function strip(){
  let h='<div class="strip">';
  DAYS.forEach(function(d){
    const st=S.days[d.n];
    const state = st&&st.done ? 'done' : (d.n===todayIndex() ? 'today' : '');
    h+='<button class="chip" data-day="'+d.n+'" data-state="'+state+'" aria-current="'+(d.n===cur)+'">'+
       '<b>'+String(d.n).padStart(2,'0')+'</b><i>'+d.date.split(' ')[0]+'</i>'+
       (st&&st.done?'<span class="dot"></span>':'')+'</button>';
  });
  return h+'</div>';
}

function stageBar(stage, labels){
  let h='<div class="steps">';
  labels.forEach(function(_,i){ h+='<div class="step'+(i<=stage?' on':'')+'"></div>'; });
  h+='</div><div class="steplabel">';
  labels.forEach(function(l,i){ h+='<span'+(i===stage?' style="color:var(--accent);font-weight:600"':'')+'>'+l+'</span>'; });
  return h+'</div>';
}

function qBlock(day, idx, item, prefix){
  const st=dayState(day);
  const key=prefix+idx;
  const awarded = st.marks[key];
  const label = prefix==='b' ? 'BOSS' : 'Q'+(idx+1);
  const isMcq = !!item.options;

  let h='<div class="q"><div class="qnum"><span class="n">'+label+'</span>'+
    '<span class="m">'+(isMcq?'choose one · ':'')+item.marks+' mark'+(item.marks>1?'s':'')+'</span></div>'+
    '<div class="prose">'+md(item.q)+'</div>';

  /* ---------- multiple choice ---------- */
  if(isMcq){
    const picked = st.picks ? st.picks[key] : undefined;
    h+='<div class="opts">';
    item.options.forEach(function(o,i){
      let cls='opt';
      if(picked!==undefined){
        if(i===item.correct) cls+=' right';
        else if(i===picked) cls+=' wrong';
        else cls+=' dim';
      }
      h+='<button class="'+cls+'"'+(picked!==undefined?' disabled':'')+' data-pick="'+day+'|'+key+'|'+i+'">'+
         '<span class="ltr">'+'ABCD'[i]+'</span><span class="otxt">'+inline(o)+'</span>'+
         (picked!==undefined && i===item.correct ? '<span class="tick">✓</span>' : '')+
         (picked!==undefined && i===picked && i!==item.correct ? '<span class="cross">✕</span>' : '')+
         '</button>';
    });
    h+='</div>';
    if(picked!==undefined){
      h+='<div class="scheme'+(picked===item.correct?'':' missed')+'">'+
         '<div class="lbl">'+(picked===item.correct?'Correct — 1 mark':'Not quite — here is why')+'</div>'+
         '<div class="prose">'+md(item.a)+'</div></div>';
    }
    return h+'</div>';
  }

  /* ---------- written, self-marked ---------- */
  const revealed = awarded!==undefined || st.marks['r'+key];
  h+='<textarea id="ta-'+day+'-'+key+'" placeholder="Write your answer here first — then reveal the mark scheme.">'+
      esc(S.drafts[day+'-'+key]||'')+'</textarea>';
  if(!revealed){
    h+='<div class="rowbtns"><button class="btn" data-reveal="'+day+'|'+key+'">Reveal mark scheme</button></div>';
  }else{
    h+='<div class="scheme"><div class="lbl">Mark scheme</div><div class="prose">'+md(item.a)+'</div></div>'+
       '<div class="marks"><span class="lbl">Marks earned</span>';
    for(let m=0;m<=item.marks;m++){
      h+='<button class="mk'+(m===0?' zero':'')+'" aria-pressed="'+(awarded===m)+'" data-mark="'+day+'|'+key+'|'+m+'|'+item.marks+'">'+m+'</button>';
    }
    h+='</div>';
  }
  return h+'</div>';
}

function renderDay(n){
  const d=DAYS.find(function(x){return x.n===n;});
  const st=dayState(n);
  let h=strip();

  if(n>todayIndex()){
    h+='<div class="banner"><b>This one is scheduled for '+d.date+'.</b> You can start it early, but the warm-up recalls the day before — it works better in order.</div>';
  }

  h+='<div class="card">'+
     '<div class="dayhead"><div><div class="eyebrow">Day '+String(n).padStart(2,'0')+' · '+d.date+'</div>'+
     '<h2>'+esc(d.title)+'</h2></div><span class="area">'+esc(d.area)+'</span></div>';

  /* ---- paper days ---- */
  if(d.paper){
    const items=d.paper.items;
    let got=0, total=0, marked=0;
    items.forEach(function(it,i){ total+=it.marks; const a=st.marks['p'+i]; if(a!==undefined){got+=a; marked++;} });
    h+='<p class="sub">'+esc(d.paper.label)+' · '+total+' marks · closed book, timed. Multiple choice where the real paper uses it; write the rest out before revealing.</p>';
    h+='</div><div class="card">';
    items.forEach(function(it,i){ h+=qBlock(n,i,it,'p'); });
    h+='</div>';
    if(marked===items.length){
      const pct=got/total;
      const band = pct>=.85?'a':(pct>=.68?'b':'c');
      const verdict = pct>=.85?'A territory. Move on with confidence.':
                      pct>=.68?'Solid. Every lost mark goes in Repeat Offenders.':
                      pct>=.55?'Re-read the core drills for the topics you dropped.':
                      'Pick the three weakest key areas and redo those drills — not all of it.';
      h+='<div class="card done-big"><div class="xp mono">'+got+' / '+total+'</div>'+
         '<div class="band '+band+'">'+Math.round(pct*100)+'%</div>'+
         '<p class="sub" style="margin-top:10px">'+verdict+'</p>'+
         (st.done?'':'<div class="nav"><button class="btn primary full" data-finish="'+n+'">Log '+(10+got)+' XP and finish</button></div>')+
         '</div>';
    }
    return h;
  }

  /* ---- day 15 ---- */
  if(d.special==='final'){
    h+='<p class="sub">The test is tomorrow. Nothing new today — this is about making what you know come out under pressure. 25 minutes, then stop.</p></div>';
    const weak = S.offenders.slice().sort(function(a,b){return (a.got/a.max)-(b.got/b.max);}).slice(0,3);
    h+='<div class="card"><div class="eyebrow">1 · Your three weak spots</div>';
    if(weak.length){
      h+='<p class="sub" style="margin-bottom:12px">Straight from what you actually dropped marks on. Re-read those core drills — just these.</p>';
      weak.forEach(function(o){
        const dd=DAYS.find(function(x){return x.n===o.day;});
        h+='<div class="off"><span class="tag">Day '+String(o.day).padStart(2,'0')+' · '+esc(dd?dd.title:'')+' · '+o.got+'/'+o.max+'</span>'+
           '<div class="qt">'+inline(o.q)+'</div></div>';
      });
    } else {
      h+='<p class="empty">Nothing logged — either a clean run or the papers were skipped. Re-read the three key areas you feel least sure of.</p>';
    }
    h+='</div><div class="card"><div class="eyebrow">2 · The five sequences</div>'+
       '<p class="sub" style="margin-bottom:14px">These carry the 3- and 4-mark questions. Write each one out cold, then check.</p>';
    (d.sequences||[]).forEach(function(s,i){
      const open = st.warm['seq'+i];
      h+='<div class="seq"><h4>'+esc(s.t)+'</h4>'+
         (open?'<div class="prose" style="margin-top:10px">'+md(s.a)+'</div>':
               '<div class="rowbtns"><button class="btn" data-seq="'+n+'|'+i+'">Check yourself</button></div>')+
         '</div>';
    });
    h+='</div><div class="card"><div class="eyebrow">3 · Then stop</div>';
    (d.checklist||[]).forEach(function(c,i){
      h+='<label class="check"><input type="checkbox" id="ck-'+i+'" data-check="'+i+'"'+(st.warm['ck'+i]?' checked':'')+'><span>'+inline(c)+'</span></label>';
    });
    h+='</div><div class="card"><div class="eyebrow">In the test tomorrow</div><div class="prose"><ul>';
    (d.examRules||[]).forEach(function(r){ h+='<li>'+inline(r)+'</li>'; });
    h+='</ul></div>'+(st.done?'':'<div class="nav"><button class="btn primary full" data-finish="'+n+'">Done — log 10 XP</button></div>')+'</div>';
    return h;
  }

  /* ---- standard day ---- */
  const hasWarm = d.warmup.length>0;
  const labels = hasWarm ? ['Warm-up','Drill','Exam reps','Boss'] : ['Drill','Exam reps'];
  if(!d.boss && hasWarm) labels.pop();
  const stage = Math.min(st.stage||0, labels.length-1);
  h+='<p class="sub">20 minutes. Timer on. Write every answer before you reveal anything.</p>'+
     stageBar(stage, labels)+'</div>';

  const nameAt = labels[stage];

  if(nameAt==='Warm-up'){
    h+='<div class="card"><div class="eyebrow">Warm-up · 3 min · no notes</div>'+
       '<p class="sub" style="margin-bottom:14px">Say each one out loud before you tap. Out loud genuinely helps.</p>';
    d.warmup.forEach(function(w,i){
      const shown=st.warm['w'+i];
      h+='<div class="flash"><div class="qq">'+inline(w.q)+'</div>';
      if(shown){
        h+='<div class="aa">'+inline(w.a)+'</div>';
      }else{
        h+='<div class="rowbtns"><button class="btn" data-warm="'+n+'|'+i+'">Show answer</button></div>';
      }
      h+='</div>';
    });
    h+='<div class="nav"><button class="btn primary full" data-stage="'+n+'|1">Next — core drill</button></div></div>';
    return h;
  }

  if(nameAt==='Drill'){
    h+='<div class="card"><div class="eyebrow">Core drill · 6 min</div>'+
       '<div class="prose">'+md(d.drill)+'</div>'+
       '<div class="nav"><button class="btn ghost" data-stage="'+n+'|'+(hasWarm?0:0)+'">Back</button>'+
       '<button class="btn primary" data-stage="'+n+'|'+(hasWarm?2:1)+'">Got it — exam reps</button></div></div>';
    return h;
  }

  if(nameAt==='Exam reps'){
    let answered=0;
    d.reps.forEach(function(it,i){ if(st.marks['q'+i]!==undefined) answered++; });
    h+='<div class="card"><div class="eyebrow">Exam reps · 8 min</div>'+
       '<p class="sub" style="margin-bottom:16px">Short recall questions are multiple choice — one tap, instant feedback. The longer ones you write out, reveal, then mark yourself, because that is how three quarters of the real paper works. Mark honestly: a mark you award yourself that SQA wouldn’t is a mark you lose in the test.</p>';
    d.reps.forEach(function(it,i){ h+=qBlock(n,i,it,'q'); });
    const nextStage = d.boss ? (hasWarm?3:2) : null;
    h+='<div class="nav"><button class="btn ghost" data-stage="'+n+'|'+(hasWarm?1:0)+'">Back</button>';
    if(nextStage!==null){
      h+='<button class="btn primary" data-stage="'+n+'|'+nextStage+'"'+(answered<d.reps.length?' disabled':'')+'>Boss question</button>';
    }else if(!st.done){
      h+='<button class="btn primary" data-finish="'+n+'"'+(answered<d.reps.length?' disabled':'')+'>Finish the day</button>';
    }
    h+='</div></div>';
    return h;
  }

  /* boss */
  const bossMark = st.marks['b0'];
  h+='<div class="card"><div class="eyebrow">Boss question · 3 min</div>'+
     '<p class="sub" style="margin-bottom:16px">Harder on purpose. Write this one out in full \u2014 it is the kind of question that separates an A from a B.</p>'+
     qBlock(n,0,d.boss,'b');
  h+='<div class="nav"><button class="btn ghost" data-stage="'+n+'|'+(hasWarm?2:1)+'">Back</button>';
  if(!st.done) h+='<button class="btn primary" data-finish="'+n+'"'+(bossMark===undefined?' disabled':'')+'>Finish the day</button>';
  h+='</div></div>';

  if(st.done){
    h+='<div class="card done-big"><div class="xp mono">+'+st.xp+' XP</div><p class="sub">Day '+n+' logged. '+
       (n<DAYS.length?'Next up: Day '+(n+1)+' — '+esc(DAYS[n].title)+'.':'That is the last one. Good luck tomorrow.')+'</p></div>';
  }
  return h;
}

function renderProgress(){
  const doneCount = Object.keys(S.days).filter(function(k){return S.days[k].done;}).length;
  const p8 = S.days[8], p14 = S.days[14];
  function paperScore(n,total){
    const st=S.days[n]; if(!st) return '—';
    let g=0,c=0; const d=DAYS.find(function(x){return x.n===n;});
    d.paper.items.forEach(function(it,i){ const a=st.marks['p'+i]; if(a!==undefined){g+=a;c++;} });
    return c?g+'/'+total:'—';
  }
  let h='<div class="grid">'+
    '<div class="tile"><b>'+totalXP()+'</b><span>XP of 210</span></div>'+
    '<div class="tile"><b>'+doneCount+'/'+DAYS.length+'</b><span>Days done</span></div>'+
    '<div class="tile"><b>'+paperScore(8,20)+'</b><span>Unit 3 paper</span></div>'+
    '<div class="tile"><b>'+paperScore(14,40)+'</b><span>Mock paper</span></div>'+
    '</div>';

  h+='<div class="card" style="margin-top:14px"><div class="eyebrow">Every day</div><div class="tablewrap"><table style="width:100%;font-size:14px;border-collapse:collapse">'+
     '<thead><tr><th>Day</th><th>Topic</th><th>Marks</th><th>XP</th></tr></thead><tbody>';
  DAYS.forEach(function(d){
    const st=S.days[d.n];
    let got=0, tot=0;
    const items = d.paper ? d.paper.items : d.reps.concat(d.boss?[d.boss]:[]);
    const pre = d.paper ? 'p' : null;
    items.forEach(function(it,i){
      tot+=it.marks;
      if(!st) return;
      const key = pre ? 'p'+i : (i<d.reps.length ? 'q'+i : 'b0');
      const a=st.marks[key]; if(a!==undefined) got+=a;
    });
    h+='<tr><td class="mono">'+String(d.n).padStart(2,'0')+'</td><td>'+esc(d.title)+'</td>'+
       '<td class="mono">'+(st&&st.done?got+'/'+tot:'—')+'</td>'+
       '<td class="mono">'+(st&&st.xp?st.xp:'—')+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

function renderOffenders(){
  let h='<div class="card"><div class="eyebrow">Repeat offenders</div>'+
        '<p class="sub" style="margin-bottom:16px">Every question you dropped a mark on, worst first. This list is what Day 15 is built from.</p>';
  if(!S.offenders.length){
    h+='<p class="empty">Nothing here yet. It fills up as you mark your answers — and an empty list after Day 08 means something is being marked too generously.</p>';
  }else{
    const sorted=S.offenders.slice().sort(function(a,b){ return (a.got/a.max)-(b.got/b.max); });
    sorted.forEach(function(o){
      const d=DAYS.find(function(x){return x.n===o.day;});
      h+='<div class="off"><span class="tag">Day '+String(o.day).padStart(2,'0')+' · '+esc(d?d.title:'')+' · '+o.got+'/'+o.max+'</span>'+
         '<div class="qt">'+inline(o.q)+'</div><div class="at">'+inline(o.a)+'</div></div>';
    });
  }
  return h+'</div>';
}

function render(){
  paintStats();
  document.getElementById('tab-mission').setAttribute('aria-selected', tab==='mission');
  document.getElementById('tab-progress').setAttribute('aria-selected', tab==='progress');
  document.getElementById('tab-offenders').setAttribute('aria-selected', tab==='offenders');
  if(tab==='mission') view.innerHTML=renderDay(cur);
  else if(tab==='progress') view.innerHTML=renderProgress();
  else view.innerHTML=renderOffenders();
}

/* ---------------- events ---------------- */
document.addEventListener('click', function(e){
  const t=e.target.closest('button, label');
  if(!t) return;

  if(t.id==='tab-mission'){ tab='mission'; render(); return; }
  if(t.id==='tab-progress'){ tab='progress'; render(); return; }
  if(t.id==='tab-offenders'){ tab='offenders'; render(); return; }

  if(t.dataset.day){ cur=+t.dataset.day; tab='mission'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }

  if(t.dataset.stage){
    const p=t.dataset.stage.split('|');
    dayState(+p[0]).stage=+p[1]; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); return;
  }

  if(t.dataset.warm){
    const p=t.dataset.warm.split('|');
    dayState(+p[0]).warm['w'+p[1]]=true; save(); render(); return;
  }

  if(t.dataset.seq){
    const p=t.dataset.seq.split('|');
    dayState(+p[0]).warm['seq'+p[1]]=true; save(); render(); return;
  }

  if(t.dataset.check!==undefined && t.tagName==='LABEL'){
    const i=t.dataset.check, st=dayState(cur);
    setTimeout(function(){ st.warm['ck'+i]=!st.warm['ck'+i]; save(); },0); return;
  }

  if(t.dataset.pick){
    const p=t.dataset.pick.split('|');
    const day=+p[0], key=p[1], i=+p[2];
    const st=dayState(day);
    if(!st.picks) st.picks={};
    if(st.picks[key]!==undefined) return;
    st.picks[key]=i;
    const d=DAYS.find(function(x){return x.n===day;});
    const item = key[0]==='p' ? d.paper.items[+key.slice(1)]
               : key[0]==='q' ? d.reps[+key.slice(1)] : d.boss;
    const got = (i===item.correct) ? item.marks : 0;
    st.marks[key]=got;
    if(got<item.marks) addOffender(day, item.q, item.a, got, item.marks); else dropOffender(day, item.q);
    save(); render(); return;
  }

  if(t.dataset.reveal){
    const p=t.dataset.reveal.split('|');
    dayState(+p[0]).marks['r'+p[1]]=true; save(); render(); return;
  }

  if(t.dataset.mark){
    const p=t.dataset.mark.split('|');
    const day=+p[0], key=p[1], m=+p[2], max=+p[3];
    const st=dayState(day);
    st.marks[key]=m;
    const d=DAYS.find(function(x){return x.n===day;});
    let item=null;
    if(key[0]==='p') item=d.paper.items[+key.slice(1)];
    else if(key[0]==='q') item=d.reps[+key.slice(1)];
    else item=d.boss;
    if(m<max) addOffender(day, item.q, item.a, m, max); else dropOffender(day, item.q);
    save(); render(); return;
  }

  if(t.dataset.finish){
    const n=+t.dataset.finish, d=DAYS.find(function(x){return x.n===n;}), st=dayState(n);
    let xp=10;
    if(d.paper){ let g=0; d.paper.items.forEach(function(it,i){ const a=st.marks['p'+i]; if(a!==undefined) g+=a; }); xp+=g; }
    else if(d.boss && st.marks['b0']===d.boss.marks) xp+=5;
    st.xp=xp; st.done=true; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); return;
  }
});

document.addEventListener('input', function(e){
  if(e.target.tagName!=='TEXTAREA') return;
  const id=e.target.id.replace('ta-','');
  const bits=id.split('-');
  S.drafts[bits[0]+'-'+bits[1]]=e.target.value;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveLocal,900);
});

/* ---------------- boot ---------------- */
loadLocal();
render();
note('Progress saves on this device');
})();
</script>
